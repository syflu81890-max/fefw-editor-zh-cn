name: Build Chinese 1.3.4
on:
  push:
    branches:
      - zh-cn-v1.3.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.11.1

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check editor and Chinese data tables
        run: >-
          python -c "import fefw_layer as lay, fefw_core as core, editor_advanced as adv,
          supports, zh_cn_names as zh, i18n_zh_cn;
          assert lay.item_ids() and lay.unit_ids() and lay.job_ids() and supports.pairs();
          assert adv.flag_names() and core.id_hash('支援会話_アレキサンドラ_カイ_C');
          assert len(supports.point_pairs()) == 2628 and supports.max_points() == 3200;
          assert all(callable(getattr(zh, n, None)) for n in ('item_name','class_name','unit_name','skill_name'))"

      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --onefile --windowed --name "FEFW Save Editor"
          --hidden-import i18n_zh_cn --hidden-import zh_cn_names
          --add-data "unit_ids.json;." --add-data "item_ids.json;." --add-data "job_ids.json;."
          --add-data "supports.json;." --add-data "support_points.json;."
          --add-data "flag_names.json;." --add-data "skill_ids.json;."
          editor.py

      - name: Package
        shell: pwsh
        run: |
          $name = "FEFW-Save-Editor-1.3.4-zh-CN"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force "$stage/icons/items", "$stage/icons/units" | Out-Null
          Copy-Item "dist/FEFW Save Editor.exe", README.zh-CN.md, README.md -Destination $stage
          Copy-Item icons/README.md -Destination "$stage/icons"
          Copy-Item icons/items/.gitkeep -Destination "$stage/icons/items"
          Copy-Item icons/units/.gitkeep -Destination "$stage/icons/units"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "stage/$name" -DestinationPath "out/$name-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FEFW-Save-Editor-1.3.4-zh-CN-windows
          path: out/*.zip
          if-no-files-found: error
