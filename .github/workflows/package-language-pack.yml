name: Package external zh-CN language pack

on:
  workflow_dispatch:
  push:
    branches: [external-language-pack-v1.0.1]
    paths:
      - "language-pack/**"
      - ".github/workflows/package-language-pack.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build language pack ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("language-pack")
          output = Path("FEFW-zh-CN-language-pack-v1.0.1.zip")
          with ZipFile(output, "w", ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      z.write(p, p.relative_to(root))
          print(output, output.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FEFW-zh-CN-language-pack-v1.0.1
          path: FEFW-zh-CN-language-pack-v1.0.1.zip
          if-no-files-found: error
          retention-days: 90
